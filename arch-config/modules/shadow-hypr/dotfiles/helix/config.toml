# Helix - Minimal config for Noctalia/DMS theming
# Editor behavior only; theme is set at runtime by Noctalia/DMS.

theme = "default"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
true-color = true
idle-timeout = 0
completion-trigger-len = 2

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.whitespace.render]
space = "none"
tab = "none"
newline = "none"

[editor.indent-guides]
render = true
character = "|"

[keys.normal]
C-s = ":w"
C-q = ":q"
