# Kitty - Minimal config for Noctalia/DMS theming
# Font and basic behavior only; colors come from the system theme.

font_family      JetBrains Mono
font_size        11.0
bold_font        auto
italic_font      auto
bold_italic_font auto

enable_audio_bell no
cursor_blink_interval 0
scrollback_lines 10000
window_padding_width 4
confirm_os_window_close 0

# Follow system theme (Noctalia/DMS handle colors)
sync_to_monitor yes
background_opacity 1.0
