# Shadow Hyprland - Minimal baseline configuration
# Auto-synced by DCLI to ~/.config/hypr/hyprland.conf

# Source shell-switcher managed files
source = ~/.config/hypr/shell-switcher-startup.conf
source = ~/.config/hypr/shell-switcher-binds.conf

# Monitor
monitor=,preferred,auto,auto

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

# General
 general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# Decoration
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Gestures
gestures {
    workspace_swipe = false
}

# Variables
$mod = SUPER

# Basic keybinds
bind = $mod, Q, exec, kitty
bind = $mod, C, killactive,
bind = $mod, M, exit,
bind = $mod, V, togglefloating,
bind = $mod, R, exec, kitty
bind = $mod SHIFT, E, exec, thunar

# Mouse binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window rules
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,title:^(File Transfer)$
